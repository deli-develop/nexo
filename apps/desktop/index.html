<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach under a notch and a home
         indicator, which is what makes env(safe-area-inset-*) report anything
         other than zero. BottomBar reads the bottom one. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nexo</title>
    <meta
      name="description"
      content="End-to-end encrypted messages, and a feed for the people you actually know."
    />
    <!-- Installable, and dark from the first paint: the colour here is what
         the browser paints around the page before any CSS has loaded, so a
         mismatch shows as a white flash on every cold start. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#090d15" />
    <link rel="icon" type="image/png" href="/icon-256.png" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
