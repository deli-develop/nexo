name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: npm audit
        run: pnpm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
          retention-days: 7

  crypto-wasm:
    name: Crypto (wasm32, in a browser engine)
    # Linux: this job builds no Windows or Tauri anything, and the wasm target
    # is the same artifact whoever builds it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI version must equal the `wasm-bindgen` crate version pinned in
      # crates/crypto-wasm/Cargo.toml. A mismatch produces a module that loads
      # and then fails on the first call, so the build script checks it too.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the wasm and runs the MLS conversation against it. This is the
      # job that would go red if OpenMLS ever stopped compiling for wasm32 --
      # which the whole client plan depends on. See docs/REWORK.md wave 3.
      - run: pnpm test:wasm
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-crypto-wasm
          path: packages/crypto-wasm/pkg
          retention-days: 7

  client:
    name: Client (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # tauri::generate_context! reads tauri.conf.json and needs frontendDist
      # to exist, so the frontend is built before the Rust client compiles.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-desktop-windows
          path: target/release/nexo-desktop.exe
          retention-days: 7

  server:
    name: Server (Linux aarch64)
    runs-on: ubuntu-24.04-arm
    env:
      # The service container below publishes on 5432. Local dev uses 5433
      # instead, to dodge a native Windows PostgreSQL install; there is no
      # such conflict on a CI runner.
      DATABASE_URL: postgres://nexo:nexo_dev@localhost:5432/nexo
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo_dev
          POSTGRES_DB: nexo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Pinned to the sqlx version in Cargo.toml. A newer CLI against an
          # older library is how the offline cache and the migrations table
          # drift apart; rule 8 applies to tools too.
          tool: sqlx-cli@0.8.6
      - run: sqlx migrate run --source apps/server/migrations
      # Only the server and the shared crates: the desktop client does not
      # build for Linux and is explicitly out of scope (brief section 11).
      - run: cargo clippy -p nexo-server -p nexo-protocol -p nexo-crypto -p nexo-platform --all-targets -- -D warnings
      - run: cargo test -p nexo-server -p nexo-protocol -p nexo-crypto -p nexo-platform
      - run: cargo build --release -p nexo-server
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-server-linux-arm64
          path: target/release/nexo-server
          retention-days: 7

  supply-chain:
    name: Supply chain (deny, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      # Two passes. The client ships only for Windows and the server runs only
      # on Linux, so a single union graph would judge each against the other's
      # dependencies. See the comment at the top of deny.toml.
      - name: cargo deny (Windows client)
        run: cargo deny --target x86_64-pc-windows-msvc --exclude nexo-server check
      - name: cargo deny (Linux server)
        run: cargo deny --target aarch64-unknown-linux-gnu --exclude nexo-desktop check
      - name: cargo audit
        run: cargo audit
