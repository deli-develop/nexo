[package]
name = "nexo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nexo desktop client. All crypto, all private keys and all plaintext-at-rest live in this process, never in the WebView."

[lib]
name = "nexo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

# A shell depends on shell things. Every Nexo crate that used to be here --
# protocol, crypto, store, platform, client -- and every OpenMLS crate with
# them went when the application moved into `packages/core` (wave 7). What
# this leaves is a Tauri app with no cryptography in it at all, which is the
# honest description of what it now does.
[dependencies]
tauri.workspace = true
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-opener = "=2.5.4"
serde.workspace = true
# `tauri::generate_context!` expands to code that names `serde_json` at the
# crate root, so this is a dependency of the macro rather than of anything
# written here. Removing it fails to compile in a way that points at lib.rs.
serde_json.workspace = true
thiserror.workspace = true
# Link previews (§4.5) fetch from this machine, never from the server. Same
# blocking client the rest of the process uses.
ureq.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The relay (relay.rs): sockets, the accept loops, the tunnel ceiling.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# Windows integration (§8). Pinned exactly, like everything else (rule 8).
tauri-plugin-notification = "=2.3.3"

# Desktop ideas, and target-scoped because Android has none of them: the
# platform owns launching, app lifecycle and updates there, so a tray, a
# startup entry, a second-instance guard and a sideloaded updater are not
# features that happen to be missing -- they are the OS's, and a plugin that
# reached for one would be fighting it.
#
# `cfg(desktop)` is Tauri's switch and Cargo does not know it, so the target
# is spelled out as what it actually means.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-updater = "=2.10.1"

# The OS window backdrop (acrylic). Windows only, because the effect is: DWM
# composites a blurred copy of the desktop behind a transparent window, and
# nothing else does that. Already in the tree as a dependency of `tauri`
# itself, so naming it here costs no extra compilation -- what it buys is a
# `Result` per effect, which `Window::set_effects` swallows. Without that the
# app could not tell whether the backdrop actually applied, and a transparent
# window with no backdrop is a hole through to the desktop.
#
# Pinned exactly, like everything else (rule 8).
[target.'cfg(windows)'.dependencies]
window-vibrancy = "=0.6.0"

# Answering WebView2's `PermissionRequested` ourselves, so a call does not open
# a browser-chrome dialog quoting `tauri.localhost`. See src/permissions.rs.
#
# Both versions are the ones `tauri` already resolves to -- the COM types have
# to be literally the same types, so these are pinned to match rather than to
# the newest release, and neither adds anything to the build.
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation"] }
# One DWORD: whether the person has Windows' own "Transparency effects" switch
# on. DWM accepts the acrylic request either way and then declines to blur, so
# without reading this the app would put a half-see-through window over a
# perfectly sharp desktop for anyone who had said no. Already in the tree.
winreg = "=0.55.0"
