# Every cargo invocation in this repo defaults to sqlx's offline mode, so the
# `sqlx::query!` macros check themselves against the committed `.sqlx/` cache
# instead of connecting to a live database. That is what lets `cargo build` and
# `cargo test --workspace` -- including the Windows CI job, which has no
# Postgres -- compile the server with no database anywhere.
#
# There is no `force = true` here on purpose: cargo's `[env]` table yields to a
# variable already set in the invoking shell, so `$env:SQLX_OFFLINE = "false"`
# before `cargo sqlx prepare` still reaches a real database to regenerate the
# cache.
[env]
SQLX_OFFLINE = "true"

# getrandom 0.3 will not choose a browser backend from a feature alone: it
# wants this cfg as well, and without it a wasm build fails to link with
# "the wasm_js backend requires --cfg getrandom_backend". Scoped to the wasm
# target, so no other build sees it.
#
# The 0.2 line in the same tree needs only its `js` feature, which
# `crates/crypto-wasm/Cargo.toml` sets. Two majors, two mechanisms; both are
# genuinely present -- `rand 0.8` brings 0.2 and OpenMLS brings 0.3.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
