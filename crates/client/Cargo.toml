[package]
name = "nexo-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Client-side session logic: registration, login and restore. Shared by the Windows client and, later, Android (brief 12) - so it holds no platform calls and no HTTP client of its own."

[dependencies]
nexo-crypto.workspace = true
nexo-protocol.workspace = true
uuid.workspace = true
nexo-platform.workspace = true
nexo-store.workspace = true
openmls.workspace = true
openmls_basic_credential.workspace = true
openmls_rust_crypto.workspace = true
openmls_traits.workspace = true
argon2.workspace = true
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true
serde_json.workspace = true
# A facade, not a subscriber: this crate records, the binary decides what to do
# with it. Added for the branches that silently pick between "we already have
# this" and "make a new one" -- the kind that produces a duplicate chat with no
# trace of why.
tracing.workspace = true
ureq = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }

[dev-dependencies]
# tests/live_auth.rs defines a fake keystore that needs an error type.
thiserror.workspace = true

[features]
# The HTTP transport. Off by default so the crate stays free of a network stack
# for any shell that wants to bring its own (brief 12).
http = ["dep:ureq", "dep:tungstenite"]

# The headless peer, for driving the desktop app against a real second client.
# It needs the transport, and `--all-targets` without the feature would
# otherwise try to build an example whose whole body is behind a `cfg`.
[[example]]
name = "peer"
required-features = ["http"]
